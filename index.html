<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/digital-numbers" rel="stylesheet"> <!-- https://www.cdnfonts.com/digital-numbers.font -->
</head>
<body>
    <div id="calculator-container">
        <div id="power-box">POWER<a id="error-shadow"></a><a id="power-light" hidden></a><a id="error-light" hidden></a></div>
        <div id="calculator-title">Odin-Calc 5000</div>
        <div id="calculator-screen"></div>
        <div id="calculator-numberpad">
            <div id="column-one">
                <button id="off-button" class="input-button" value="off">OFF</button>
                <button id="7-button" class="input-button" value="7">7</button>
                <button id="4-button" class="input-button" value="4">4</button>
                <button id="1-button" class="input-button" value="1">1</button>
                <button id="0-button" class="input-button" value="0">0</button>
            </div>

            <div id="column-two">
                <button id="clear-button" class="input-button" value="CE">CE</button>
                <button id="8-button" class="input-button" value="8">8</button>
                <button id="5-button" class="input-button" value="5">5</button>
                <button id="2-button" class="input-button" value="2">2</button>
                <button id="decimal-button" class="input-button" value=".">.</button>
            </div>

            <div id="column-three">
                <button id="back-button" class="input-button" value="Backspace">←</button>
                <button id="9-button" class="input-button" value="9">9</button>
                <button id="6-button" class="input-button" value="6">6</button>
                <button id="3-button" class="input-button" value="3">3</button>
                <button id="equals-button" class="input-button" value="=">=</button>
            </div>

            <div id="column-four">
                <button id="÷-button" class="input-button" value="÷">÷</button>
                <button id="×-button" class="input-button" value="×">×</button>
                <button id="−-button" class="input-button" value="−">−</button>
                <button id="+-button" class="input-button plus" value="+">+</button>
            </div>
        </div>
    </div>


    <script src="calculator.js"></script>
</body>
</html>
